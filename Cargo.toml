[package]
name = "emaxx"
version = "30.2.0"
edition = "2024"

[dependencies]
ropey = "1.6"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.14"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
# Delegate shell-style `*`, `?`, and bracket-class path expansion to the
# established crate instead of maintaining a partial handwritten matcher.
glob = "=0.3.4"
num-bigint = "0.4"
num-traits = "0.2"
chrono = "0.4"
unicode-bidi = "0.3.18"
unicode-general-category = "1.1"
# GNU Emacs 30.2 ships Unicode 15.1 property tables.  Keep the name
# repertoire pinned to that same revision: newer assigned code points are
# observably `nil'/`Cn' through get-char-code-property in GNU 30.2.
unicode_names2 = "=1.2.2"
unicode-width = "0.2"
flate2 = "1.1"
# Delegate standardized legacy single-byte encodings to the mature WHATWG
# implementation instead of maintaining error-prone handwritten tables.
encoding_rs = "=0.8.35"
libxml = "0.3.16"
rusqlite = { version = "0.34", features = ["bundled"] }
# Global Lisp value cells need stable enumeration plus constant-time lookup,
# update, and removal.  Use the established linked hash map already present in
# the dependency graph instead of synchronizing a vector with a shadow index.
hashlink = "=0.10.0"
lcms2 = "6.1.1"
lcms2-sys = "4.0.6"
md5 = "0.8.0"
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10.8"
# GNU's GnuTLS digest catalog includes both generations of the GOST hash
# standard.  Use the established RustCrypto implementations on the same
# digest-trait generation as the existing SHA crates.
streebog = "=0.10.2"
gost94 = "=0.10.4"
getrandom = "0.3"
# Cryptographic input extraction creates temporary Rust buffers.  Use the
# established compile-fenced implementation so key material is not left behind
# or optimized out of an ordinary overwrite.
zeroize = "=1.9.0"
libc = "0.2"
serialport = { version = "4.9.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
# Official upstream runtime/bindings; grammar modules remain independently
# loadable, matching Emacs's Tree-sitter boundary.
tree-sitter = "=0.26.11"
# Grammar modules are ordinary dynamic libraries.  Keep the unsafe platform
# boundary inside this established, narrowly scoped loader crate.
libloading = "=0.8.9"
# Enumerate platform interfaces through the maintained cross-platform wrapper
# instead of duplicating unsafe getifaddrs / Windows adapter bindings.
if-addrs = "=0.15.0"
# Delegate platform recycle-bin semantics (Finder Trash, Windows Recycle Bin,
# and the freedesktop.org Trash specification) to the established backend.
trash = "=5.2.6"
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tree-sitter-json = "=0.24.8"

# Compatibility scenarios exercise real-time network and timer behavior.
# Optimize the interpreter itself in development builds so their upstream
# wall-clock deadlines measure semantics instead of debug-code throughput;
# dependency builds and debug assertions remain unchanged.
[profile.dev.package.emaxx]
opt-level = 1

# Whole-program optimization for release binaries: fat LTO plus a single
# codegen unit lets the VM dispatch loop inline Value clone/drop and the
# hot primitive paths across module boundaries.
[profile.release]
lto = "fat"
codegen-units = 1
