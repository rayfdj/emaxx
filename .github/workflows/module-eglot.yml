name: GNU module and Eglot compatibility
on:
  push:
    branches: ["fix/module-abi-eglot"]
  workflow_dispatch:
    inputs:
      followup:
        description: Finish the stopped 9a44331 Rust inventory and reproduce its baseline failure
        type: boolean
        default: false
      cli_baseline_only:
        description: Replay the two CLI backtrace failures on the unchanged base only
        type: boolean
        default: false
      resume_native_merge:
        description: Continue the native-comp merge gate from run 34757432755
        type: boolean
        default: false
      native_tls_only:
        description: Diagnose and gate the remaining real TLS transport checks only
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: emaxx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: emaxx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: emacs-mirror/emacs
          ref: 636f166cfc86aa90d63f592fd99f3fdd9ef95ebd
          path: emacs
          persist-credentials: false
      - name: Install compiler, oracle and language server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config texinfo autoconf automake \
            libgnutls28-dev gnutls-bin gdb libncurses-dev libgccjit-13-dev libgmp-dev libxml2-dev \
            libsqlite3-dev zlib1g-dev libtree-sitter-dev libx11-dev libxpm-dev \
            libjpeg-dev libgif-dev libtiff-dev libpng-dev libxft-dev libxrender-dev \
            libxt-dev liblcms2-dev libharfbuzz-dev libcairo2-dev librsvg2-dev \
            libwebp-dev libseccomp-dev libasound2-dev libacl1-dev libselinux1-dev clangd
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.75.0 --profile minimal --component rust-analyzer --component rust-src
          rustup default 1.97.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: oracle-cache
        with:
          path: emacs
          key: native-abi-oracle-ubuntu24-636f166c-${{ hashFiles('emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs') }}
      - name: Build the pinned GNU oracle with its exact native ABI configuration
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        working-directory: emacs
        run: |
          ./autogen.sh
          python3 - <<'PY'
          import json, re, shlex, subprocess
          from pathlib import Path
          text = Path('../emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs').read_text()
          options = re.search(r'NATIVE_ABI_SYSTEM_CONFIGURATION_OPTIONS: &str = ("[^"\n]*");', text)[1]
          subprocess.run(['./configure', *shlex.split(json.loads(options))], check=True)
          PY
          make -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: emacs
          key: native-abi-oracle-ubuntu24-636f166c-${{ hashFiles('emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs') }}
      - name: Verify the native ABI against the configured GNU oracle
        run: |
          mkdir -p /tmp/module-eglot-metadata
          ../emacs/src/emacs -Q --batch --eval \
            '(prin1 (list emacs-version emacs-repository-version system-type system-configuration-options system-configuration-features))' \
            > /tmp/module-eglot-metadata/oracle.txt
          rustc --edition 2024 -O tools/generate_native_subrs.rs -o /tmp/generate-native-subrs
          /tmp/generate-native-subrs ../emacs/src ../emacs/src/emacs /tmp/module-eglot-metadata/native-subrs.rs
          rustfmt --edition 2024 /tmp/module-eglot-metadata/native-subrs.rs
          cmp src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs /tmp/module-eglot-metadata/native-subrs.rs
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: modules-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            modules-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
            openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
      - name: Build Emaxx and run Rust regression controls
        if: github.event.inputs.followup != 'true'
        env:
          LANG: C
          LC_ALL: C
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
        run: |
          cargo clean --package emaxx
          cargo clean --package emaxx --profile gate
          cargo build --locked --profile gate --bin emaxx -j2
          if [ '${{ github.event.inputs.resume_native_merge }}' != true ] && [ '${{ github.event.inputs.native_tls_only }}' != true ]; then
            cargo test --locked --profile gate --lib -j2 -- \
              lisp::modules lisp::json lisp::native_comp::runtime::tests \
              module_load_validates_and_initializes call_process_reports_signal_termination \
              commandp interactive_form call_interactively process_send_string \
              accept_process_output pdumper dump_roots --test-threads=1
            python3 -m unittest discover -s tools -p test_module_eglot_gates.py -v
          fi
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -j2 -- -D warnings
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && github.event.inputs.followup != 'true' && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: modules-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
      - name: Require GNU and Emaxx module success
        if: always() && !cancelled() && github.event.inputs.followup != 'true' && github.event.inputs.native_tls_only != 'true'
        run: python3 tools/emacs_module_gate.py --output /tmp/module-results
      - name: Require GNU and Emaxx Eglot success
        if: always() && !cancelled() && github.event.inputs.followup != 'true' && github.event.inputs.native_tls_only != 'true'
        run: python3 tools/eglot_gate.py --output /tmp/eglot-results
      - name: Complete serial Rust regression gate
        if: success() && github.event.inputs.followup != 'true' && github.event.inputs.resume_native_merge != 'true' && github.event.inputs.native_tls_only != 'true'
        run: python3 tools/serial_grouped_gate.py --scope full --artifact-root /tmp/module-eglot-rust-gate
      - name: Continue the native-comp merge gate from its completed tests
        if: success() && github.event.inputs.followup != 'true' && github.event.inputs.resume_native_merge == 'true' && github.event.inputs.native_tls_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          run = '34757432755'
          subprocess.run(['gh', 'run', 'watch', run, '--interval', '30', '--exit-status'], check=False)
          previous = json.loads(subprocess.check_output(
              ['gh', 'run', 'view', run, '--json', 'headSha,status,conclusion'], text=True))
          assert previous['headSha'] == 'c7811e021c31e31613a11d15b2befefbb7867a5a'
          assert previous['status'] == 'completed' and previous['conclusion'] in ('success', 'failure')
          root = Path('/tmp/module-eglot-previous-merge')
          subprocess.run(['gh', 'run', 'download', run, '--dir', str(root)], check=True)
          summaries = list(root.rglob('module-eglot-rust-gate/summary.json'))
          assert len(summaries) == 1, summaries
          subprocess.run(['python3', 'tools/native_comp_merge_followup.py',
                          '--previous', str(summaries[0].parent),
                          '--output', '/tmp/module-eglot-rust-continued'], check=True)
          PY
      - name: Require real TLS transport success and capture a native failure
        if: success() && github.event.inputs.native_tls_only == 'true'
        run: python3 tools/native_tls_gate.py --output /tmp/native-tls-results
      - name: Check out the unchanged base for the failure control
        if: github.event.inputs.followup == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1f54e9797933c6bf5249c347fc71b0fffc295b41
          path: baseline
          persist-credentials: false
      - name: Finish the stopped Rust inventory and replay its failure on the base
        if: github.event.inputs.followup == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_BASELINE_ONLY: ${{ github.event.inputs.cli_baseline_only }}
          CARGO_BUILD_JOBS: '2'
          LANG: C
          LC_ALL: C
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
        run: |
          gh run download 34730542855 --repo rayfdj/emaxx --dir /tmp/module-eglot-previous
          if [ "$CLI_BASELINE_ONLY" = true ]; then
            python3 tools/module_eglot_regression_followup.py --cli-baseline-only \
              --previous /tmp/module-eglot-previous --baseline ../baseline \
              --output /tmp/module-eglot-rust-followup
          else
            cargo clean --package emaxx --profile gate
            cargo build --locked --profile gate --bin emaxx -j2
            python3 tools/module_eglot_regression_followup.py \
              --previous /tmp/module-eglot-previous --baseline ../baseline \
              --output /tmp/module-eglot-rust-followup
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: module-eglot-linux-${{ github.sha }}
          path: |
            /tmp/module-results
            /tmp/eglot-results
            !/tmp/eglot-results/bin
            /tmp/module-eglot-rust-gate
            /tmp/module-eglot-metadata
            /tmp/module-eglot-rust-followup
            /tmp/module-eglot-rust-continued
            /tmp/module-eglot-previous-merge
            /tmp/native-tls-results
          if-no-files-found: error
          retention-days: 7
