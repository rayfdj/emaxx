name: Linux runtime compatibility
on:
  push:
    branches: [investigate/openpgp-linux, "integrate/native-comp-*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: emaxx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: emaxx
          ref: a612e355e9d6bb3b44d868856bc9e8ad30040976
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: emacs-mirror/emacs
          ref: 636f166cfc86aa90d63f592fd99f3fdd9ef95ebd
          path: emacs
          persist-credentials: false
      - name: Install compiler and oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config texinfo autoconf automake \
            libgnutls28-dev libncurses-dev libgccjit-13-dev libgmp-dev libxml2-dev \
            libsqlite3-dev zlib1g-dev libtree-sitter-dev libx11-dev libxpm-dev \
            libjpeg-dev libgif-dev libtiff-dev libpng-dev libxft-dev libxrender-dev \
            libxt-dev liblcms2-dev libharfbuzz-dev libcairo2-dev librsvg2-dev \
            libwebp-dev libseccomp-dev libasound2-dev libacl1-dev libselinux1-dev \
            gnupg gpgsm
          mkdir -p /tmp/openpgp-metadata
          dpkg-query -W > /tmp/openpgp-metadata/packages.txt
          gpg --version > /tmp/openpgp-metadata/gpg-version.txt
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: oracle-cache
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Build GNU Emacs 30.2 with the Linux capability set
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        working-directory: emacs
        run: |
          ./autogen.sh
          ./configure --with-native-compilation --with-x --with-x-toolkit=no \
            --with-tree-sitter --with-gnutls --with-xml2 --with-sqlite3 --with-modules \
            --with-rsvg --with-webp --with-lcms2 --with-cairo --with-harfbuzz \
            --with-xpm --with-jpeg --with-tiff --with-gif --with-png \
            --without-imagemagick --without-dbus --without-libotf --without-m17n-flt
          make -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Record actual oracle identity (not a frozen-corpus repin)
        run: |
          ../emacs/src/emacs -Q --batch --eval \
            '(prin1 (list emacs-version emacs-repository-version system-type system-configuration-options system-configuration-features))' \
            > /tmp/openpgp-metadata/oracle.txt
          sha256sum ../emacs/src/emacs > /tmp/openpgp-metadata/oracle-sha256.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
          restore-keys: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
      - name: Build current Emaxx
        run: cargo +1.97.1 build --locked --profile gate --bin emaxx -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
      - name: Record compiler versions and source identity
        run: |
          rustc -Vv > /tmp/openpgp-metadata/default-rustc.txt
          cargo -V > /tmp/openpgp-metadata/default-cargo.txt
          rustc +1.97.1 -Vv > /tmp/openpgp-metadata/focused-rustc.txt
          git rev-parse HEAD > /tmp/openpgp-metadata/candidate-head.txt
      - name: Reproduce native identity with public-fixture binary diagnostics
        env:
          LANG: C
          LC_ALL: C
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
        run: |
          mkdir -p /tmp/integration-completion
          set +e
          cargo +1.97.1 test --locked --profile gate --test native_comp_identity > /tmp/integration-completion/native-identity.log 2>&1
          identity_status=$?
          set -e
          printf '%s\n' "$identity_status" > /tmp/integration-completion/native-identity-exit.txt
          python3 - <<'PYTHON'
          import os, subprocess, shutil, json, hashlib
          from pathlib import Path
          root=Path('/tmp/integration-completion')
          for work in Path('/tmp').glob('native-comp-identity-*'):
              case=work/'case-0'
              source=work/'test/src/comp-resources/comp-test-45603.el'
              for name,binary in [('gnu-repeat','../emacs/src/emacs'),('emaxx-repeat','target/gate/emaxx')]:
                  home=case/(name+'-home');temporary=case/(name+'-tmp');home.mkdir();temporary.mkdir()
                  env={'PATH':os.environ['PATH'],'HOME':str(home),'TMPDIR':str(temporary),'LANG':'C','LC_ALL':'C'}
                  with (root/(name+'.log')).open('w') as out:
                      r=subprocess.run([binary,'-Q','--batch','-f','batch-native-compile',str(source)],env=env,stdout=out,stderr=subprocess.STDOUT,timeout=300)
                  print(name,'exit',r.returncode)
              artifacts=sorted(case.glob('**/comp-test-45603-*.eln'))
              manifest=[]
              for i,p in enumerate(artifacts):
                  prefix=root/('elf-'+str(i))
                  shutil.copyfile(p,str(prefix)+'.eln')
                  for tool,args in [('readelf',['-aW']),('objdump',['-drwC']),('strings',['-a'])]:
                      with Path(str(prefix)+'.'+tool+'.txt').open('w') as out:
                          subprocess.run([tool,*args,str(p)],stdout=out,stderr=subprocess.STDOUT,check=True)
                  manifest.append({'source':str(p),'copy':prefix.name+'.eln','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size})
              (root/'elf-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
              shutil.copyfile(source,root/source.name)
          PYTHON
      - name: Run the two integration targets still pending
        env:
          LANG: C
          LC_ALL: C
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
        run: |
          set -o pipefail
          cargo +1.97.1 test --locked --profile gate --no-fail-fast --test native_thread_continuations --test package_lifecycle 2>&1 | tee /tmp/integration-completion/remaining-integration.log
      - name: Strict Clippy
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-merge-native-diagnostics
          path: |
            /tmp/integration-completion
            /tmp/openpgp-metadata
          if-no-files-found: error
          retention-days: 7
