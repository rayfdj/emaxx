name: Linux runtime compatibility
on:
  push:
    branches: [investigate/openpgp-linux, "integrate/native-comp-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: emaxx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: emaxx
          ref: 66d650bb21e1bb38710eb90cde12c000a450eb2d
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: emacs-mirror/emacs
          ref: 636f166cfc86aa90d63f592fd99f3fdd9ef95ebd
          path: emacs
          persist-credentials: false
      - name: Install compiler and oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config texinfo autoconf automake \
            libgnutls28-dev libncurses-dev libgccjit-13-dev libgmp-dev libxml2-dev \
            libsqlite3-dev zlib1g-dev libtree-sitter-dev libx11-dev libxpm-dev \
            libjpeg-dev libgif-dev libtiff-dev libpng-dev libxft-dev libxrender-dev \
            libxt-dev liblcms2-dev libharfbuzz-dev libcairo2-dev librsvg2-dev \
            libwebp-dev libseccomp-dev libasound2-dev libacl1-dev libselinux1-dev \
            gnupg gpgsm
          mkdir -p /tmp/openpgp-metadata
          dpkg-query -W > /tmp/openpgp-metadata/packages.txt
          gpg --version > /tmp/openpgp-metadata/gpg-version.txt
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: oracle-cache
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Build GNU Emacs 30.2 with the Linux capability set
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        working-directory: emacs
        run: |
          ./autogen.sh
          ./configure --with-native-compilation --with-x --with-x-toolkit=no \
            --with-tree-sitter --with-gnutls --with-xml2 --with-sqlite3 --with-modules \
            --with-rsvg --with-webp --with-lcms2 --with-cairo --with-harfbuzz \
            --with-xpm --with-jpeg --with-tiff --with-gif --with-png \
            --without-imagemagick --without-dbus --without-libotf --without-m17n-flt
          make -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Record actual oracle identity (not a frozen-corpus repin)
        run: |
          ../emacs/src/emacs -Q --batch --eval \
            '(prin1 (list emacs-version emacs-repository-version system-type system-configuration-options system-configuration-features))' \
            > /tmp/openpgp-metadata/oracle.txt
          sha256sum ../emacs/src/emacs > /tmp/openpgp-metadata/oracle-sha256.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
          restore-keys: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
      - name: Build current Emaxx
        run: cargo +1.97.1 build --locked --profile gate --bin emaxx -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
      - name: Diagnose primitive boundaries on unchanged source
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          
          output = Path(os.environ.get('PROBE_OUTPUT', '/tmp/native-merge-probes'))
          output.mkdir(parents=True, exist_ok=False)
          source = Path('src/lisp/primitives/tests.rs').read_text()
          
          def fixture(name):
              body = source.split('fn ' + name + '()', 1)[1]
              return re.search(r'let program = r#"(.*?)"#;', body, re.S)[1]
          
          dead = fixture('dead_thread_results_are_rooted_only_through_reachable_thread_objects')
          vector = fixture('suspended_bytecode_observes_live_constant_vector_mutation')
          search = fixture('program_search_follows_openp_over_exec_path')
          dead_setup = dead[:dead.index('        (let ((reachable')]
          dead_setup += '''
          (setq dead-thread-roots-result (list (hash-table-count dead-thread-roots-table)))
          (setq dead-thread-roots-worker nil)
          '''
          vector_setup = vector[:vector.index('(setq gc-vector-thread nil gc-vector-constants nil)')]
          vector_setup += '(setq gc-vector-thread nil gc-vector-constants nil)\n'
          
          cases = [
              ('dead-original', dead, None),
              ('vector-original', vector, None),
              ('dead-after-load', dead_setup, '(progn (garbage-collect) (setq dead-thread-roots-result (append dead-thread-roots-result (list (hash-table-count dead-thread-roots-table)))) (prin1 dead-thread-roots-result))'),
              ('vector-after-load', vector_setup, '(progn (garbage-collect) (setq gc-vector-result (append gc-vector-result (list (hash-table-count gc-vector-table)))) (prin1 gc-vector-result))'),
              ('program-search-original', '(prin1 ' + search + ')', None),
          ]
          for label,connection in [('pty','t'),('pipe','nil')]:
              cases.append(('argv0-'+label, '''
          (let* ((process-connection-type CONNECTION)
                 (b (generate-new-buffer "argv0"))
                 (p (start-process "argv0" b "sh" "-c" "echo $0")))
            (while (process-live-p p) (sleep-for 0.05))
            (let ((early (with-current-buffer b (buffer-string))))
              (while (accept-process-output p 0.1))
              (prin1 (list (executable-find "sh") (process-command p)
                           early (with-current-buffer b (buffer-string))
                           (process-status p) (process-exit-status p)))))
          '''.replace('CONNECTION',connection), None))
          
          results=[]
          for label,program,observe in cases:
              path=output/(label+'.el');path.write_text(program)
              if observe: (output/(label+'-observe.el')).write_text(observe+'\n')
              for editor,binary in [('gnu','../emacs/src/emacs'),('emaxx','target/gate/emaxx')]:
                  command=[binary,'-Q','--batch','-l',str(path)]
                  if observe: command += ['--eval',observe]
                  result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.PIPE,env={**os.environ,'LANG':'C','LC_ALL':'C'},timeout=300)
                  (output/(label+'-'+editor+'.stdout')).write_bytes(result.stdout)
                  (output/(label+'-'+editor+'.stderr')).write_bytes(result.stderr)
                  record={'case':label,'editor':editor,'command':command,'exit':result.returncode,'stdout':result.stdout.decode(errors='replace'),'stderr':result.stderr.decode(errors='replace')}
                  results.append(record)
                  print(json.dumps(record),flush=True)
                  (output/'results.json').write_text(json.dumps(results,indent=2)+'\n')
          
          (output/'binary-hashes.json').write_text(json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in ['../emacs/src/emacs','target/gate/emaxx']},indent=2)+'\n')
          PY
      - name: Reproduce the three Rust failures in isolation
        env:
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
          EMAXX_IMAGE_TEMPLATE: '1'
        run: |
          set +e
          cargo +1.97.1 test --locked --profile gate --lib -- \
            program_search_follows_openp_over_exec_path \
            dead_thread_results_are_rooted_only_through_reachable_thread_objects \
            suspended_bytecode_observes_live_constant_vector_mutation \
            --test-threads=1 > /tmp/native-merge-probes/rust-focused.log 2>&1
          observed_status=$?
          set -e
          printf '%s\n' "$observed_status" > /tmp/native-merge-probes/rust-exit.txt
          cat /tmp/native-merge-probes/rust-focused.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-merge-primitive-probes
          path: /tmp/native-merge-probes
          if-no-files-found: error
          retention-days: 7
