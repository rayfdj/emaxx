name: Linux runtime compatibility
on:
  push:
    branches: [investigate/openpgp-linux, "integrate/native-comp-*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: emaxx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: emaxx
          ref: 8bf354bfad4cdaec3e7a49162dd3bbeec26cd23e
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: emacs-mirror/emacs
          ref: 636f166cfc86aa90d63f592fd99f3fdd9ef95ebd
          path: emacs
          persist-credentials: false
      - name: Install compiler and oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config texinfo autoconf automake \
            libgnutls28-dev libncurses-dev libgccjit-13-dev libgmp-dev libxml2-dev \
            libsqlite3-dev zlib1g-dev libtree-sitter-dev libx11-dev libxpm-dev \
            libjpeg-dev libgif-dev libtiff-dev libpng-dev libxft-dev libxrender-dev \
            libxt-dev liblcms2-dev libharfbuzz-dev libcairo2-dev librsvg2-dev \
            libwebp-dev libseccomp-dev libasound2-dev libacl1-dev libselinux1-dev \
            gnupg gpgsm
          mkdir -p /tmp/openpgp-metadata
          dpkg-query -W > /tmp/openpgp-metadata/packages.txt
          gpg --version > /tmp/openpgp-metadata/gpg-version.txt
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: oracle-cache
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Build GNU Emacs 30.2 with the Linux capability set
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        working-directory: emacs
        run: |
          ./autogen.sh
          ./configure --with-native-compilation --with-x --with-x-toolkit=no \
            --with-tree-sitter --with-gnutls --with-xml2 --with-sqlite3 --with-modules \
            --with-rsvg --with-webp --with-lcms2 --with-cairo --with-harfbuzz \
            --with-xpm --with-jpeg --with-tiff --with-gif --with-png \
            --without-imagemagick --without-dbus --without-libotf --without-m17n-flt
          make -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: emacs
          key: openpgp-oracle-ubuntu24-636f166c-v1
      - name: Record actual oracle identity (not a frozen-corpus repin)
        run: |
          ../emacs/src/emacs -Q --batch --eval \
            '(prin1 (list emacs-version emacs-repository-version system-type system-configuration-options system-configuration-features))' \
            > /tmp/openpgp-metadata/oracle.txt
          sha256sum ../emacs/src/emacs > /tmp/openpgp-metadata/oracle-sha256.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
          restore-keys: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
      - name: Build current Emaxx
        run: cargo +1.97.1 build --locked --profile gate --bin emaxx -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target
          key: openpgp-rust-ubuntu24-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
      - name: Record compiler versions and source identity
        run: |
          rustc -Vv > /tmp/openpgp-metadata/default-rustc.txt
          cargo -V > /tmp/openpgp-metadata/default-cargo.txt
          rustc +1.97.1 -Vv > /tmp/openpgp-metadata/focused-rustc.txt
          git rev-parse HEAD > /tmp/openpgp-metadata/candidate-head.txt
      - name: Inspect CLI loader representation and controlled stdio fixture
        run: |
          mkdir -p /tmp/integration-completion
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          root=Path('/tmp/integration-completion')
          program=root/'stdio.el'
          program.write_text('(princ "one\\n")\n(message "two")\n(princ "three")\n(message "four")\n(flush-standard-output)\n(message "five")\n(defun cli-probe-g () (cli-probe-undefined 1 2))\n(defun cli-probe-f () (cli-probe-g))\n(cli-probe-f)\n')
          setup='(progn (setq load-source-file-function nil) (defun cli-probe-load () (load '+json.dumps(str(program))+' nil t)))'
          identity="(prin1 (mapcar (lambda (s) (list s (type-of (symbol-function s)) (subr-native-elisp-p (symbol-function s)))) '(command-line-1 load-with-code-conversion)))"
          results=[]
          for name,binary in [('gnu','../emacs/src/emacs'),('emaxx','target/gate/emaxx')]:
              for case,args in [('identity',['--eval',identity]),('original',['-l',str(program)]),('controlled',['--eval',setup,'-f','cli-probe-load'])]:
                  with (root/(name+'-'+case+'.log')).open('w') as out:
                      r=subprocess.run([binary,'-Q','--batch',*args],stdout=out,stderr=subprocess.STDOUT,timeout=300)
                  results.append({'editor':name,'case':case,'exit':r.returncode})
          (root/'probes.json').write_text(json.dumps(results,indent=2)+'\n')
          PYTHON
      - name: Run the four integration targets not reached by the previous gate
        env:
          LANG: C
          LC_ALL: C
          RUST_MIN_STACK: '134217728'
          RUST_TEST_THREADS: '1'
        run: |
          set -o pipefail
          cargo test --locked --profile gate --test ert_runner --test native_comp_identity --test native_thread_continuations --test package_lifecycle 2>&1 | tee /tmp/integration-completion/remaining-integration.log
      - name: Strict Clippy
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-merge-integration-completion
          path: |
            /tmp/integration-completion
            /tmp/openpgp-metadata
          if-no-files-found: error
          retention-days: 7
