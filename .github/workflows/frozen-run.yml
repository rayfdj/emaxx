name: Ordinary frozen compatibility
on:
  workflow_dispatch:
    inputs:
      validation:
        description: Oracle preparation, ordinary tests, full Rust gate, or sandbox diagnostics
        type: choice
        options: [prepare-oracle, affected, frozen, rust, sandbox-diagnostics, image-diagnostics, startup-diagnostics, allocator-diagnostics, compiler-diagnostics, compiler-samples]
        default: affected
      file:
        description: For affected mode, run only this upstream file; blank runs module and Eglot
        type: string
        default: ''
      rust_filter:
        description: Optional targeted Rust control to accompany an affected ordinary file
        type: string
        default: ''
      baseline_revision:
        description: Full commit ID for the before binary in allocator diagnostics
        type: string
        default: fb45ffdf253d23d4442cf87c56ae4d4291b86562
      startup_syscall:
        description: Syscall to inspect in startup-diagnostics mode
        type: choice
        options: [sysinfo, sched_getaffinity]
        default: sysinfo
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: emaxx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: emaxx
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: emacs-mirror/emacs
          ref: 636f166cfc86aa90d63f592fd99f3fdd9ef95ebd
          path: emacs
          persist-credentials: false
      - name: Install recorded oracle and language server prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config texinfo autoconf automake time \
            libgnutls28-dev gnutls-bin gdb libncurses-dev libgccjit-13-dev libgmp-dev libxml2-dev \
            libsqlite3-dev zlib1g-dev libtree-sitter-dev libx11-dev libxpm-dev \
            libjpeg-dev libgif-dev libtiff-dev libpng-dev libxft-dev libxrender-dev \
            libxt-dev liblcms2-dev libharfbuzz-dev libcairo2-dev librsvg2-dev \
            libwebp-dev libseccomp-dev libasound2-dev libacl1-dev libselinux1-dev clangd bubblewrap strace
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.75.0 --profile minimal --component rust-analyzer --component rust-src
          rustup default 1.97.1
      - name: Enable bubblewrap's required user namespaces
        run: |
          # Grant the installed sandbox executable its required namespace
          # capability, following Ubuntu's application-profile mechanism.
          # The host's general namespace restriction and GNU's BPF filters
          # remain in force. This VM is discarded after the job.
          sudo apparmor_parser -r compat/ci-bwrap.apparmor
          bwrap --ro-bind / / -- /bin/true
          mkdir -p target/frozen-ci/metadata
          cp compat/ci-bwrap.apparmor target/frozen-ci/metadata/
      - name: Install process-scoped compiler sampling tools
        if: inputs.validation == 'compiler-samples'
        run: sudo apt-get install -y linux-tools-generic
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: oracle-cache
        with:
          path: emacs
          key: native-abi-oracle-ubuntu24-636f166c-${{ hashFiles('emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs') }}
      - name: Build GNU with the existing Linux native ABI configuration
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        working-directory: emacs
        run: |
          ./autogen.sh
          python3 - <<'PY'
          import json, re, shlex, subprocess
          from pathlib import Path
          text = Path('../emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs').read_text()
          options = re.search(r'NATIVE_ABI_SYSTEM_CONFIGURATION_OPTIONS: &str = ("[^"\n]*");', text)[1]
          subprocess.run(['./configure', *shlex.split(json.loads(options))], check=True)
          PY
          make -j2
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: emacs
          key: native-abi-oracle-ubuntu24-636f166c-${{ hashFiles('emaxx/src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs') }}
      - name: Verify GNU native ABI and capture its build identity
        run: |
          mkdir -p target/frozen-ci/metadata
          ../emacs/src/emacs -Q --batch --eval \
            '(prin1 (list emacs-version emacs-repository-version system-type system-configuration-options system-configuration-features))' \
            > target/frozen-ci/metadata/oracle.txt
          rustc --edition 2024 -O tools/generate_native_subrs.rs -o /tmp/generate-native-subrs
          /tmp/generate-native-subrs ../emacs/src ../emacs/src/emacs /tmp/native-subrs.rs
          rustfmt --edition 2024 /tmp/native-subrs.rs
          cmp src/lisp/native_comp/generated_native_subrs_x86_64_unknown_linux_gnu.rs /tmp/native-subrs.rs
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target/debug
            emaxx/target/gate
            emaxx/target/compat-subject
          key: frozen-build-linux-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            frozen-build-linux-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-
      - name: Build current runner and check Rust formatting and lint
        run: |
          cargo clean --package emaxx --profile gate
          cargo build --locked --profile gate --bin compat-harness -j2
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -j2 -- -D warnings
      - name: Execute the requested validation or diagnosis
        env:
          VALIDATION: ${{ inputs.validation || 'prepare-oracle' }}
          VALIDATION_FILE: ${{ inputs.file }}
          VALIDATION_RUST_FILTER: ${{ inputs.rust_filter }}
          BASELINE_REVISION: ${{ inputs.baseline_revision || 'fb45ffdf253d23d4442cf87c56ae4d4291b86562' }}
          STARTUP_SYSCALL: ${{ inputs.startup_syscall || 'sysinfo' }}
        run: |
          mkdir -p target/frozen-ci
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('../emacs').resolve()
          Path('compat/oracle.local.json').write_text(json.dumps({
              'format_version': 1,
              'emacs_binary': str(source / 'src/emacs'),
              'emacs_repo': str(source),
          }, indent=2) + '\n')
          PY
          run_harness() {
            env -i HOME="$HOME" PATH="$PATH" LANG=C CARGO_BUILD_JOBS=2 \
              RUST_MIN_STACK=134217728 RUST_TEST_THREADS=1 target/gate/compat-harness "$@"
          }
          if [ "$VALIDATION" = prepare-oracle ]; then
            # Explicit pin proposal for review. This is NOT a frozen certificate:
            # the old lock describes an Ubuntu source repack, while existing
            # native CI uses the pristine GNU revision checked out above.
            cp compat/oracle.lock.linux.json target/frozen-ci/oracle-lock-before.json
            run_harness oracle pin --emacs ../emacs/src/emacs --repo ../emacs
            cp compat/oracle.lock.linux.json target/frozen-ci/oracle-lock-proposed.json
          fi
          case "$VALIDATION" in
            sandbox-diagnostics|image-diagnostics|startup-diagnostics|allocator-diagnostics|compiler-diagnostics|compiler-samples)
              # Diagnostic children only; this does not replace an ordinary
              # run or alter the kernel filter or its expected behavior.
              cargo build --locked --profile gate --target-dir target/compat-subject \
                --bin emaxx --bin make-fingerprint -j2
              if [ "$VALIDATION" = startup-diagnostics ]; then
                # Capture the caller of the startup syscall rejected by
                # the inherited GNU filter. This stops for inspection and
                # makes no claim about the editor's eventual exit status.
                gdb --batch -ex "catch syscall $STARTUP_SYSCALL" -ex run -ex bt \
                  --args "$PWD/target/compat-subject/gate/emaxx" \
                    --quick --batch '--eval=(message "Hi")' \
                    2>&1 | tee target/frozen-ci/startup-backtrace.log
                exit 0
              fi
              if [ "$VALIDATION" = image-diagnostics ]; then
                # Stop at the actual bootstrap fault and retain its native
                # backtrace. This diagnostic never certifies frozen outcomes.
                EMAXX_DUMP_SOURCE_DIRECTORY="$PWD/../emacs" \
                  EMACS_TEST_DIRECTORY="$PWD/../emacs/test" LC_ALL=C \
                  gdb --batch --return-child-result -ex run -ex 'thread apply all bt' \
                    --args "$PWD/target/compat-subject/gate/emaxx" \
                    -batch -l loadup --temacs=pdump \
                    --bin-dest "$PWD/target/compat-subject/gate/" \
                    --eln-dest "$PWD/../emacs/" \
                    2>&1 | tee target/frozen-ci/image-backtrace.log
                exit 0
              fi
              EMAXX_DUMP_SOURCE_DIRECTORY="$PWD/../emacs" \
                EMACS_TEST_DIRECTORY="$PWD/../emacs/test" \
                tools/build-image.sh target/compat-subject/gate/emaxx
              if [ "$VALIDATION" = compiler-samples ]; then
                # Sample only this diagnostic process tree. The editors run
                # under the ordinary runner account; no global perf policy is
                # changed and no unrelated processes are sampled. Eight real
                # compiler cases provide repeated children; this is not a
                # compatibility certificate or an uninstrumented benchmark.
                perf_binary=$(python3 - <<'PY'
          from pathlib import Path
          candidates = sorted(Path('/usr/lib/linux-tools').glob('*/perf'))
          if not candidates:
              raise SystemExit('Installed Linux perf executable was not found')
          print(candidates[-1].resolve(strict=True))
          PY
                )
                diagnostic_user=$(id -un)
                sample_status=0
                sudo "$perf_binary" record -e cpu-clock:u -F 997 \
                  --call-graph dwarf,16384 -o "$PWD/target/frozen-ci/compiler-perf.data" \
                  -- sudo -u "$diagnostic_user" -- env "PATH=$PATH" \
                  python3 tools/profile_native_compiler.py --oracle-source ../emacs \
                    --emaxx target/compat-subject/gate/emaxx \
                    --selector '"^comp-tests-ret-type-spec-[1-8]$"' \
                    --output target/frozen-ci/compiler-samples \
                  2>&1 | tee target/frozen-ci/compiler-perf.log || sample_status=$?
                # perf deliberately creates a private file for its recorder.
                # Hand that one file to the job account so raw evidence can
                # be uploaded even when the diagnostic itself failed.
                if [ -f target/frozen-ci/compiler-perf.data ]; then
                  sudo chown "$diagnostic_user" target/frozen-ci/compiler-perf.data
                fi
                if [ "$sample_status" -ne 0 ]; then
                  exit "$sample_status"
                fi
                sudo "$perf_binary" report --stdio --no-children \
                  -i target/frozen-ci/compiler-perf.data --sort comm,dso,symbol \
                  > target/frozen-ci/compiler-perf-self.txt
                sudo "$perf_binary" report --stdio --children --percent-limit 0.5 \
                  -i target/frozen-ci/compiler-perf.data --sort comm,dso,symbol \
                  > target/frozen-ci/compiler-perf-callers.txt
                exit 0
              fi
              if [ "$VALIDATION" = compiler-diagnostics ]; then
                python3 tools/profile_native_compiler.py --oracle-source ../emacs \
                  --emaxx target/compat-subject/gate/emaxx \
                  --selector '"^comp-tests-ret-type-spec-"' \
                  --output target/frozen-ci/compiler-diagnostics
                exit 0
              fi
              if [ "$VALIDATION" = allocator-diagnostics ]; then
                # Build the actual pre-change implementation against the
                # same GNU libraries; retained scores are never inputs.
                baseline_root="$RUNNER_TEMP/allocator-before"
                mkdir -p "$baseline_root"
                [[ "$BASELINE_REVISION" =~ ^[0-9a-f]{40}$ ]]
                git worktree add --detach "$baseline_root/emaxx" "$BASELINE_REVISION"
                ln -s "$PWD/../emacs" "$baseline_root/emacs"
                cargo build --locked --profile gate \
                  --manifest-path "$baseline_root/emaxx/Cargo.toml" \
                  --target-dir "$PWD/target/allocator-before" \
                  --bin emaxx --bin make-fingerprint -j2
                EMAXX_DUMP_SOURCE_DIRECTORY="$PWD/../emacs" \
                  EMACS_TEST_DIRECTORY="$PWD/../emacs/test" \
                  "$baseline_root/emaxx/tools/build-image.sh" \
                    "$PWD/target/allocator-before/gate/emaxx"
                python3 tools/measure_allocators.py --oracle-source ../emacs \
                  --binary "before=$PWD/target/allocator-before/gate/emaxx" \
                  --binary "after=$PWD/target/compat-subject/gate/emaxx" \
                  --output target/frozen-ci/allocator-diagnostics
                python3 tools/measure_core_latency.py \
                  --output target/frozen-ci/core-diagnostics
                exit 0
              fi
              control_status=0
              EMAXX_DUMP_SOURCE_DIRECTORY="$PWD/../emacs" \
                EMACS_TEST_DIRECTORY="$PWD/../emacs/test" \
                cargo test --locked --profile gate --target-dir target/compat-subject \
                  --test cli -j2 linux_ -- --test-threads=1 \
                  2>&1 | tee target/frozen-ci/linux-startup-controls.log || control_status=$?
              python3 tools/diagnose_linux_sandbox.py --oracle-source ../emacs \
                --emaxx target/compat-subject/gate/emaxx \
                --output target/frozen-ci/sandbox-diagnostics || control_status=$?
              exit "$control_status"
              ;;
            prepare-oracle|affected)
              if [ "$VALIDATION" = affected ] && [ -n "$VALIDATION_FILE" ]; then
                if [ -n "$VALIDATION_RUST_FILTER" ]; then
                  EMACS_TEST_DIRECTORY="$PWD/../emacs/test" \
                    cargo test --locked --profile gate --lib -j2 "$VALIDATION_RUST_FILTER" \
                      -- --test-threads=1 2>&1 | tee target/frozen-ci/runtime-control.log
                fi
                run_harness run --file "$VALIDATION_FILE" 2>&1 | tee target/frozen-ci/affected.log
                exit 0
              fi
              status=0
              run_harness run --file test/src/emacs-module-tests.el 2>&1 | tee target/frozen-ci/module.log || status=$?
              run_harness run --file test/lisp/progmodes/eglot-tests.el 2>&1 | tee target/frozen-ci/eglot.log || status=$?
              exit "$status"
              ;;
            frozen)
              run_harness frozen 2>&1 | tee target/frozen-ci/frozen.log
              ;;
            rust)
              LANG=C LC_ALL=C RUST_TEST_THREADS=1 CARGO_BUILD_JOBS=2 \
                python3 tools/serial_grouped_gate.py --scope full --artifact-root target/frozen-ci/rust
              ;;
            *)
              echo "Unknown validation mode: $VALIDATION" >&2
              exit 2
              ;;
          esac
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            emaxx/target/debug
            emaxx/target/gate
            emaxx/target/compat-subject
          key: frozen-build-linux-1.97.1-${{ hashFiles('emaxx/Cargo.lock') }}-${{ github.sha }}
      - name: Collect only this run's raw compatibility evidence
        if: always()
        run: |
          python3 - <<'PY'
          import re, shutil
          from pathlib import Path
          root = Path('target/frozen-ci')
          for name in ('module', 'eglot', 'affected', 'frozen'):
              log = root / f'{name}.log'
              if not log.exists():
                  continue
              for value in re.findall(r'^Artifacts: (.+)$', log.read_text(), re.M):
                  source = Path(value)
                  if source.is_dir():
                      shutil.copytree(source, root / 'compat' / source.name,
                          ignore=lambda directory, names: [n for n in names if n == 'tools' or n.startswith('runtime-')])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ordinary-linux-${{ github.sha }}
          path: emaxx/target/frozen-ci
          retention-days: 14
